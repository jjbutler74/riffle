[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riffle"
version = "0.1.0"
description = "Cast a photo slideshow from local folders to a Chromecast"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PyExifTool>=0.5.6",
    "pychromecast>=14.0",
    "platformdirs>=4.0",
    "reverse_geocoder>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
riffle = "riffle.cli:main"

[tool.setuptools.packages.find]
include = ["riffle*"]

[tool.setuptools.package-data]
riffle = []
