# Sample Riffle config.
#
# Copy this file to the location Riffle expects by default --
# %APPDATA%\Riffle\config.toml on Windows -- or pass a custom path with
# `riffle --config path\to\config.toml <command>`.

[riffle]

# Required: folders to recursively scan for .jpg/.jpeg files.
root_folders = [
    "D:/Photos/Family",
    "D:/Photos/Trips",
]

# Path to the exiftool executable. Defaults to "exiftool" (must be on PATH).
# Uncomment and set this if it's not on PATH -- e.g. after installing via
# `winget install --id=OliverBetz.ExifTool -e`.
# exiftool_path = "C:/Users/you/AppData/Local/Programs/ExifTool/ExifTool.exe"

# Friendly name of the Chromecast to cast to. If unset, Riffle casts to the
# first Chromecast it discovers on the network.
# chromecast_name = "Living Room TV"

# IP address of the Chromecast, queried directly in addition to the normal
# network search. Set this if `riffle play` says "No Chromecast found" even
# though the TV is on (e.g. a PC with several network adapters). Giving the
# device a reserved IP in your router keeps this from going stale.
# chromecast_host = "192.168.1.140"

# Seconds each photo stays on screen before advancing. Default: 30
# interval_seconds = 30

# Local HTTP server settings used to serve resized/captioned photos to the
# Chromecast. Default host binds all interfaces so the Chromecast can reach it.
# http_host = "0.0.0.0"
# http_port = 8420

# Max dimensions photos are resized to before serving (Chromecast 2nd gen
# has 512MB RAM -- never serve full-res). Default: 1920x1080
# max_width = 1920
# max_height = 1080

# Where the SQLite database and image cache are stored. Defaults to the
# platform data dir (%LOCALAPPDATA%\Riffle on Windows).
# data_dir = "D:/RiffleData"

# Number of files per exiftool batch call during scan. Default: 400
# exiftool_batch_size = 400

# If true, reshuffle the whole order each time the slideshow wraps back to
# the start of a cycle, instead of preserving the original shuffled order.
# Default: false
# reshuffle_on_wrap = false

# Seconds to wait for the Chromecast to confirm it's displaying a photo
# before treating the attempt as failed and retrying. Older devices (e.g.
# Chromecast 2nd gen) can take a long time to cold-launch the Default Media
# Receiver app on the very first cast, so if you see "Timed out waiting for
# Chromecast media status" in the logs, try raising this. Default: 25
# cast_confirm_timeout_seconds = 25

# Each photo's caption shows whose camera it came from, taken from a
# year-suffixed folder name: "JenniferPhone2023" or "Sabrina2024" -> the
# name before "Phone"/the year. List folder-derived names that aren't people
# here to keep them off the caption (case-insensitive). Default: []
# hidden_folder_names = ["Other", "SLR", "Screenshot"]

# If true, only photos with a description (from the photo's own metadata or
# a Google Takeout .json sidecar) are shown; the rest are skipped.
# Default: true
# only_with_description = true

# Cameras and apps often fill the title/description with text nobody typed:
# "OLYMPUS DIGITAL CAMERA", "SONY DSC", the camera's model name, the file
# name ("IMG_1234"), or a timestamp. Riffle already treats those as "no
# caption". List any others your photos have here; each must match the whole
# caption, ignoring case and extra spaces, and * matches anything. Takes
# effect on the next `riffle rescan` -- no full re-read needed. Default: []
# ignore_captions = ["HONOR CAMERA", "Photo by *"]

# Caption extras -- each can be turned off. Title/description and the date
# itself always show. Defaults: everything on except show_time.
# show_location = true      # nearest town from the photo's GPS, e.g. "Kaikoura, Canterbury"
# show_folder_name = true   # whose phone, from the folder name, e.g. "Jennifer"
# show_weekday = true       # "Monday, February 6, 2023"
# show_time = false         # "..., 2:10 PM"
# show_years_ago = true     # "· 3 years ago"

# Only show photos taken within this range (inclusive). Use a date
# (2015-01-01) or just a year (2015 means Jan 1 for date_from, Dec 31 for
# date_to). Leave either out for no limit on that side. Default: no limits.
# date_from = 2015
# date_to = 2020-06-30

# Photo files the scan should never open, e.g. a file on a damaged part of
# the drive where reading it hangs. Default: []
# skip_files = ["D:/Pictures/2024/SLR2024/IMG_0380.JPG"]
